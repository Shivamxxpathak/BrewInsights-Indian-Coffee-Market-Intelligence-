name: BrewInsights Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q dashboard src scripts tests
      - name: Run repository tests
        run: pytest -q
      - name: Streamlit import smoke test
        run: python -c "import streamlit, plotly, pandas, numpy, sklearn; print('Dashboard dependencies import successfully')"