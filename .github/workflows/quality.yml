name: BrewInsights Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/requirements_dashboard.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q dashboard src scripts tests
      - name: Run repository tests
        run: pytest -q
      - name: Dependency consistency check
        run: pip check

      - name: Streamlit import smoke test
        run: python -c "import streamlit, plotly, pandas, numpy, sklearn; print('Dashboard dependencies import successfully')"

      - name: Dashboard runtime smoke test
        shell: bash
        run: |
          python -m streamlit run dashboard/app.py --server.headless true --server.port 8501 > /tmp/brewinsights-streamlit.log 2>&1 &
          PID=$!
          trap "kill $PID" EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/ > /dev/null; then
              echo "Dashboard started successfully"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brewinsights-streamlit.log
          exit 1